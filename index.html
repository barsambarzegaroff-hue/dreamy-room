  color:color,

 color,
 x,y,z
){

  new THREE.BoxGeometry(w,h,d),

 );

 m.receiveShadow=true;

 scene.add(m);

 return m;
}

/* =====================================================
   MOVEMENT
===================================================== */

let joyX=0;
let joyY=0;

let moving=false;

const speed=.065;

function movePlayer(){

 if(!moving)return;

 const dx=joyX*speed;
 const dz=joyY*speed;

 player.position.x+=dx;
 player.position.z+=dz;

 /* house boundaries */

 player.position.x=
  THREE.MathUtils.clamp(
   player.position.x,
   -8.8,
   8.8
  );

 player.position.z=
  THREE.MathUtils.clamp(
   player.position.z,
   -6.8,
   6.8
  );

 const amount=
  Math.sqrt(
   joyX*joyX+
   joyY*joyY
  );

 if(amount>.1){

  player.rotation.y=
   Math.atan2(
    joyX,
    joyY
   );
 }

}


/* =====================================================
   WALK ANIMATION
===================================================== */

let walkTime=0;

function animatePlayer(){

 if(moving){

  walkTime+=.22;

  legL.rotation.x=
   Math.sin(walkTime)*.65;

  legR.rotation.x=
   Math.sin(walkTime+Math.PI)*.65;

  armL.rotation.x=
   Math.sin(walkTime+Math.PI)*.45;

  armR.rotation.x=
   Math.sin(walkTime)*.45;

  player.position.y=
   Math.abs(
    Math.sin(walkTime)
   )*.025;

 }else{

  legL.rotation.x*=.8;
  legR.rotation.x*=.8;
  armL.rotation.x*=.8;
  armR.rotation.x*=.8;

  player.position.y*=.8;
 }

}


/* =====================================================
   JOYSTICK
===================================================== */

const joy=
 document.getElementById("joy");

const stick=
 document.getElementById("stick");

function joystick(e){

 const rect=
  joy.getBoundingClientRect();

 const cx=
  rect.left+
  rect.width/2;

 const cy=
  rect.top+
  rect.height/2;

 let dx=
  e.clientX-cx;

 let dy=
  e.clientY-cy;

 const max=38;

 const dist=
  Math.sqrt(dx*dx+dy*dy);

 if(dist>max){

  dx=dx/dist*max;
  dy=dy/dist*max;

 }

 stick.style.transform=
  `translate(${dx}px,${dy}px)`;

 joyX=dx/max;
 joyY=dy/max;

 moving=
  Math.abs(joyX)+
  Math.abs(joyY)>.1;
}

function stopJoy(){

 joyX=0;
 joyY=0;
 moving=false;

 stick.style.transform=
  "translate(0,0)";
}

joy.addEventListener(
 "pointerdown",
 e=>{
  joy.setPointerCapture(e.pointerId);
  joystick(e);
 }
);

joy.addEventListener(
 "pointermove",
 e=>{
  if(e.buttons)
   joystick(e);
 }
);

joy.addEventListener(
 "pointerup",
 stopJoy
);

joy.addEventListener(
 "pointercancel",
 stopJoy
);

   PET FOLLOW
===================================================== */

function updatePet(){

 const dx=
  player.position.x-
  pet.position.x;

 const dz=
  player.position.z-
  pet.position.z;

 const dist=
  Math.sqrt(dx*dx+dz*dz);

 if(dist>2){

  pet.position.x+=
   dx*.025;

  pet.position.z+=
   dz*.025;

  pet.rotation.y=
   Math.atan2(
    dx,
    dz
   );
 }

}


/* =====================================================
   CAMERA
===================================================== */

let cameraAngle=.55;
let cameraDistance=14;

function updateCamera(){

 camera.position.x=
  player.position.x+
  Math.sin(cameraAngle)*
  cameraDistance;

 camera.position.z=
  player.position.z+
  Math.cos(cameraAngle)*
  cameraDistance;

 camera.position.y=8;

 camera.lookAt(
  player.position.x,
  1.2,
  player.position.z
 );

}

updateCamera();

function rotateCamera(direction){

 cameraAngle+=
  direction*.35;

}

window.rotateCamera=rotateCamera;

window.zoom=function(dir){

 cameraDistance+=
  dir>0?-1:1;

 cameraDistance=
  THREE.MathUtils.clamp(
   cameraDistance,
   8,
   19
  );

};

window.buy=function(price){

 if(coins<price){

  message("💎 سکه کافی نیست!");

  return;
 }

 coins-=price;

 addXP(8);

 updateStats();

 message(
  "🛍️ خرید انجام شد!"
 );

};

window.buyOutfit=function(){

 if(coins<60){

  message("💎 سکه کافی نیست!");

  return;
 }

 coins-=60;

 outfitIndex++;

  outfitIndex=0;

 message("👗 لباس خریداری شد!");

};


/* =====================================================
   MINI GAME
===================================================== */

let miniActive=false;

window.miniGame=function(){

 if(miniActive)return;

 miniActive=true;

 let left=10;

 message(
  "🎮 مینی‌گیم! ۱۰ بار سریع صفحه را لمس کن!"
 );

 function tap(){

  left--;

  coins+=3;

  updateStats();

  if(left<=0){

   miniActive=false;

   addXP(25);

   message(
    "🎉 بردی! +30 💎"
   );

   renderer.domElement
    .removeEventListener(
     "pointerdown",
     tap
    );

  }

 }

 renderer.domElement
  .addEventListener(
   "pointerdown",
   tap
  );

};


/* =====================================================
   DAILY REWARD
===================================================== */

window.reward=function(){

 const today=
  new Date().toDateString();

 const last=
  localStorage.getItem(
   "dreamyDaily"
  );

 if(last===today){

  message(
   "🎁 جایزه امروز رو گرفتی!"
  );

  return;
 }

 localStorage.setItem(
  "dreamyDaily",
  today
 );

 coins+=100;

 addXP(20);

 message(
  "🎁 +100 💎 جایزه روزانه!"
 );

};

   PANELS
===================================================== */

const panel=
 document.getElementById("panel");

window.openPanel=function(type){

 if(type==="style")
  panel.innerHTML=stylePanel();

 if(type==="rooms")
  panel.innerHTML=roomsPanel();

 if(type==="shop")
  panel.innerHTML=shopPanel();

 if(type==="furniture")
  panel.innerHTML=furniturePanel();

 panel.style.display="block";

};

window.closePanel=function(){

 panel.style.display="none";

};


/* =====================================================
   MESSAGE
===================================================== */

let messageTimer;

function message(t){

 const el=
  document.getElementById("msg");

 el.textContent=t;

 el.style.opacity=1;

 clearTimeout(messageTimer);

 messageTimer=
  setTimeout(()=>{
   el.style.opacity=0;
  },1800);

}


/* =====================================================
   ANIMATION
===================================================== */

let time=0;

function animate(){

 requestAnimationFrame(
  animate
 );

 time+=.03;

 movePlayer();

 animatePlayer();

 updatePet();

 updateCamera();

 pet.position.y=
  Math.sin(time*3)*.025;

 pet.rotation.y+=.005;

 renderer.render(
  scene,
  camera
 );

}

animate();

   RESIZE
===================================================== */

window.addEventListener(
 "resize",
 ()=>{

  camera.aspect=
   innerWidth/innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
   innerWidth,
   innerHeight
  );

  renderer.setPixelRatio(
   PIXEL_RATIO
  );

 }
);
