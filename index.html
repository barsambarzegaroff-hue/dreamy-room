function mat(c){
 return new THREE.MeshStandardMaterial({
  color:c,roughness:.78
 });
}

function meshBox(w,h,d,c,x,y,z,add=true){
 const m=new THREE.Mesh(
  new THREE.BoxGeometry(w,h,d),mat(c)
 );
 m.position.set(x,y,z);
 m.castShadow=true;
 m.receiveShadow=true;
 if(add)scene.add(m);
 return m;
}

function meshSphere(r,c,x,y,z,add=true){
 const m=new THREE.Mesh(
  new THREE.SphereGeometry(
   r,powerful?18:12,powerful?14:10
  ),mat(c)
 );
 m.position.set(x,y,z);
 m.castShadow=true;
 m.receiveShadow=true;
 if(add)scene.add(m);
 return m;
}

function cyl(r,h,c,x,y,z,add=true){
 const m=new THREE.Mesh(
  new THREE.CylinderGeometry(r,r,h,16),
  mat(c)
 );
 m.position.set(x,y,z);
 m.castShadow=true;
 m.receiveShadow=true;
 if(add)scene.add(m);
 return m;
}

  new THREE.BoxGeometry(Math.min(w-1,5),.7,.12),
  mat(0xffffff)

 sign.position.set(0,4.3,d/2+.08);
 g.add(sign);

 /* door */
 const door=new THREE.Mesh(
  new THREE.BoxGeometry(1.2,2.2,.12),
  mat(0x5a3b43)
 );
 door.position.set(0,1.1,d/2+.1);
 g.add(door);

 /* windows */
 for(let xx=-1.3;xx<=1.3;xx+=2.6){
  const win=new THREE.Mesh(
   new THREE.BoxGeometry(1.1,1.1,.08),
   mat(0x9edfff)
  );
  win.position.set(xx,2.5,d/2+.09);
  g.add(win);
 }

 g.position.set(x,0,z);
 scene.add(g);

 buildings.push({
  name,
  group:g,
  x,z,
  w,d,
  emoji
 });

 return g;
}

/* =========================================================
   MOVEMENT
========================================================= */

let joyX=0;
let joyY=0;
let moving=false;

function movePlayer(){

 if(!moving)return;

 const speed=.09;

 player.position.x+=joyX*speed;
 player.position.z+=joyY*speed;

 player.position.x=THREE.MathUtils.clamp(
  player.position.x,-47,47
 );

 player.position.z=THREE.MathUtils.clamp(
  player.position.z,-47,47
 );

 player.rotation.y=Math.atan2(joyX,joyY);
}


/* =========================================================
   WALK
========================================================= */

let walkTime=0;

function animatePlayer(){

 if(moving){

  walkTime+=.22;

  parts.legL.rotation.x=
   Math.sin(walkTime)*.65;

  parts.legR.rotation.x=
   Math.sin(walkTime+Math.PI)*.65;

  parts.armL.rotation.x=
   Math.sin(walkTime+Math.PI)*.45;

  parts.armR.rotation.x=
   Math.sin(walkTime)*.45;

  player.position.y=
   Math.abs(Math.sin(walkTime))*.025;

 }else{

  parts.legL.rotation.x*=.8;
  parts.legR.rotation.x*=.8;
  parts.armL.rotation.x*=.8;
  parts.armR.rotation.x*=.8;
 }
}


/* =========================================================
   JOYSTICK
========================================================= */

const joy=document.getElementById("joy");
const stick=document.getElementById("stick");

function joystick(e){

 const r=joy.getBoundingClientRect();

 let dx=e.clientX-(r.left+r.width/2);
 let dy=e.clientY-(r.top+r.height/2);

 const max=38;
 const d=Math.hypot(dx,dy);

 if(d>max){
  dx=dx/d*max;
  dy=dy/d*max;
 }

 stick.style.transform=
  `translate(${dx}px,${dy}px)`;

 joyX=dx/max;
 joyY=dy/max;

 moving=Math.abs(joyX)+Math.abs(joyY)>.1;
}

function stopJoy(){
 joyX=0;joyY=0;moving=false;
 stick.style.transform="translate(0,0)";
}

joy.addEventListener("pointerdown",e=>{
 joy.setPointerCapture(e.pointerId);
 joystick(e);
});

joy.addEventListener("pointermove",e=>{
 if(e.buttons)joystick(e);
});

joy.addEventListener("pointerup",stopJoy);
joy.addEventListener("pointercancel",stopJoy);


/* =========================================================
   PET FOLLOW
========================================================= */

function updatePet(){

 const dx=player.position.x-pet.position.x;
 const dz=player.position.z-pet.position.z;
 const d=Math.hypot(dx,dz);

 if(d>2){
  pet.position.x+=dx*.025;
  pet.position.z+=dz*.025;
  pet.rotation.y=Math.atan2(dx,dz);
 }
}


/* =========================================================
   NPC ANIMATION
========================================================= */

function updateNPCs(t){

 npcs.forEach(n=>{
  n.g.position.x=
   n.baseX+Math.sin(t+n.phase)*.8;

  n.g.position.z=
   n.baseZ+Math.cos(t*.7+n.phase)*.5;
 });
}


/* =========================================================
   CARS ANIMATION
========================================================= */

function updateCars(){

 cars.forEach(c=>{

  if(c.axis===0){
   c.g.position.x+=c.speed;

   if(c.g.position.x>50)
    c.g.position.x=-50;
  }else{
   c.g.position.z+=c.speed;

   if(c.g.position.z>50)
    c.g.position.z=-50;
  }

 });
}


/* =========================================================
   CAMERA
========================================================= */

let cameraAngle=.6;
let cameraDistance=13;

function updateCamera(){

 camera.position.x=
  player.position.x+
  Math.sin(cameraAngle)*cameraDistance;

 camera.position.z=
  player.position.z+
  Math.cos(cameraAngle)*cameraDistance;

 camera.position.y=8;

 camera.lookAt(
  player.position.x,
  1.2,
  player.position.z
 );
}

function rotateCamera(d){
 cameraAngle+=d*.35;
}

function zoom(d){
 cameraDistance+=d>0?-1:1;
 cameraDistance=THREE.MathUtils.clamp(
  cameraDistance,7,20
 );
}

window.rotateCamera=rotateCamera;
window.zoom=zoom;

  scene.background.set(0x10152e);

 }else{

};

   MONEY / XP
========================================================= */

let coins=Number(localStorage.getItem("dreamyCoins")||250);
let xp=Number(localStorage.getItem("dreamyXP")||0);
let level=Number(localStorage.getItem("dreamyLevel")||1);

function updateStats(){

 document.getElementById("coins").textContent=coins;
 document.getElementById("xp").textContent=xp;
 document.getElementById("level").textContent=level;
}

function addXP(n){

 xp+=n;

 while(xp>=100){
  xp-=100;
  level++;
  coins+=50;
  message("🎉 Level Up! +50 💎");
 }

 updateStats();
 save();
}

/* =========================================================
   MINI GAME
========================================================= */

let miniActive=false;
let taps=0;

window.miniGame=function(){

 if(miniActive)return;

 miniActive=true;
 taps=0;

 message("🎮 10 بار صفحه را لمس کن!");

 function tap(){

  taps++;
  coins+=3;
  updateStats();

  if(taps>=10){

   miniActive=false;
   addXP(25);
   message("🎉 بردی! +30 💎");

   renderer.domElement.removeEventListener(
    "pointerdown",tap
   );
  }
 }

 renderer.domElement.addEventListener(
  "pointerdown",tap
 );
};


/* =========================================================
   DAILY
========================================================= */

window.reward=function(){

 const today=new Date().toDateString();

 if(localStorage.getItem("dreamyDaily")===today){
  message("🎁 جایزه امروز رو گرفتی!");
  return;
 }

 localStorage.setItem("dreamyDaily",today);

 coins+=100;
 addXP(20);

 message("🎁 +100 💎 جایزه روزانه!");
};


/* =========================================================
   PANELS
========================================================= */

const panel=document.getElementById("panel");

window.openPanel=function(type){

 if(type==="city")
  panel.innerHTML=cityPanel();

 if(type==="shops")
  panel.innerHTML=shopsPanel();

 if(type==="style")
  panel.innerHTML=stylePanel();

 if(type==="rooms")
  panel.innerHTML=roomsPanel();

 panel.style.display="block";
};

window.closePanel=function(){
 panel.style.display="none";
};


/* =========================================================
   MESSAGE
========================================================= */

let messageTimer;

function message(t){

 const el=document.getElementById("msg");

 el.textContent=t;
 el.style.opacity=1;

 clearTimeout(messageTimer);

 messageTimer=setTimeout(()=>{
  el.style.opacity=0;
 },1800);
}

   LOAD
========================================================= */

outfitIndex=

hairIndex=

accessoryIndex=
 Number(localStorage.getItem("dreamyAccessory")||0);

buildCharacter();
updateStats();


/* =========================================================
   GAME LOOP
========================================================= */

let time=0;

function animate(){

 requestAnimationFrame(animate);

 time+=.03;

 movePlayer();
 animatePlayer();
 updatePet();
 updateNPCs(time);
 updateCars();

 pet.position.y=
  Math.sin(time*3)*.025;

 pet.rotation.y+=.005;

 updateCamera();

 renderer.render(scene,camera);
}

animate();


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener("resize",()=>{

 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();

 renderer.setSize(innerWidth,innerHeight);
 renderer.setPixelRatio(DPR);
});
